---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Host networking puts HA on the LAN so mDNS (Zeroconf), SSDP and
          # DHCP discovery work. Port 8123 is then also reachable on the node IP.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
        initContainers:
          matter-permissions:
            image: &matterImage
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.6.1@sha256:5591f9f65926ca4b13b34cfd9c9888cb9d9ee9f147fe0b04c8e025cbeeee0eb7
            command: ["sh", "-c", "chown 1000:1000 /data"]
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN"]
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8123
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                # Raw sockets for the DHCP discovery watcher (aiodhcpwatcher)
                add: ["NET_RAW"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          matter-server:
            image: *matterImage
            env:
              TZ: America/Chicago
              STORAGE_PATH: /data
              PRIMARY_INTERFACE: eno1
              # No auth on the WebSocket API: bind to localhost so only HA
              # (same pod, host network) can reach it, not the whole LAN.
              LISTEN_ADDRESS: 127.0.0.1
              NODE_OPTIONS: --max-old-space-size=512
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 768Mi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "false"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/description: Home automation hub
          gethomepage.dev/group: Home
          gethomepage.dev/icon: home-assistant.png
          gethomepage.dev/href: "https://homeassistant.${SECRET_DOMAIN}"
        hostnames: ["homeassistant.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: home-assistant
        advancedMounts:
          home-assistant:
            app:
              - path: /config
            # Matter fabric credentials sit on the HA volume so the nightly
            # VolSync backup covers them; losing them means re-pairing.
            matter-permissions:
              - path: /data
                subPath: matter-server
            matter-server:
              - path: /data
                subPath: matter-server
      tmp:
        type: emptyDir
