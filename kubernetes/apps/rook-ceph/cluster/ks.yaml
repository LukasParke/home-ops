---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster
spec:
  # Suspended until the 3x 500GB NVMe drives are installed and visible as
  # /dev/nvme1n1 on each node (see kubernetes/docs/rook-ceph-migration.md).
  # Enable with: flux -n rook-ceph resume kustomization rook-ceph-cluster
  # (then flip this to false and commit to make it durable in Git).
  suspend: true
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/rook-ceph/cluster/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: rook-ceph
  wait: true
