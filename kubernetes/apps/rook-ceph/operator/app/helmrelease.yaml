---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.4
      sourceRef:
        kind: HelmRepository
        name: rook-release
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # RBAC + ServiceMonitors for ceph daemons (cluster chart requires this).
    monitoring:
      enabled: true
    csi:
      serviceMonitor:
        enabled: true
