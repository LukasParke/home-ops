---
# Sync the coder external-auth secrets from the self-hosted Infisical
# instance. NOT registered in ../kustomization.yaml yet — see README.md in
# this directory for the enablement runbook (Infisical project + machine
# identity must exist first).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: coder-secrets
  namespace: default
spec:
  hostAPI: https://infisical.${SECRET_DOMAIN}/api
  resyncInterval: 10m
  authentication:
    universalAuth:
      credentialsRef:
        secretName: coder-infisical-identity
        secretNamespace: default
      secretsScope:
        projectSlug: coder
        envSlug: prod
        secretsPath: /
        recursive: false
  managedKubeSecretReferences:
    # Same Secret the HelmRelease consumes; creationPolicy Orphan lets the
    # operator take over the existing static secret without recreating it.
    - secretName: coder-external-auth
      secretNamespace: default
      creationPolicy: Orphan
      refreshInterval: 10m
