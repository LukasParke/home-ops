---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  chartRef:
    kind: OCIRepository
    name: coder
  interval: 1h
  values:
    controllers:
      coder:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/coder/coder
              tag: 2.36.6@sha256:a7daad452864428ce1e93d37706b780f248b06ccb2f8e2fcb2ffd9a11f10ebd4
            env:
              TZ: Etc/UTC
              CODER_HTTP_ADDRESS: 0.0.0.0:7080
              CODER_ACCESS_URL: "https://coder.${SECRET_DOMAIN}"
              CODER_TELEMETRY_ENABLE: "false"
              CODER_DATA_DIR: &dataDir /data
              CODER_PG_CONNECTION_URL:
                valueFrom:
                  secretKeyRef:
                    name: coder-database-app
                    key: uri
              # GitHub external auth (private repo clones + git auth in
              # workspaces). Values live in secret.sops.yaml — replace the
              # placeholder client id/secret after creating the GitHub OAuth
              # app; reloader rolls the pod on change. Note: coder validates
              # the provider at boot, so the client id must never be empty.
              CODER_EXTERNAL_AUTH_0_ID:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_GITHUB_EXTERNAL_AUTH_ID
              CODER_EXTERNAL_AUTH_0_TYPE:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_GITHUB_EXTERNAL_AUTH_TYPE
              CODER_EXTERNAL_AUTH_0_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_GITHUB_CLIENT_ID
              CODER_EXTERNAL_AUTH_0_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_GITHUB_CLIENT_SECRET
              # GitHub OAuth login/signup — same OAuth app as external auth,
              # second callback URL: /oauth2/github/callback. ALLOW_SIGNUP +
              # ALLOW_EVERYONE let any GitHub account register (coder refuses
              # to boot with signup enabled and no policy); tighten to a
              # GitHub org with CODER_OAUTH2_GITHUB_ALLOWED_ORGS if open
              # registration is too broad.
              CODER_OAUTH2_GITHUB_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_OAUTH2_GITHUB_CLIENT_ID
              CODER_OAUTH2_GITHUB_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: coder-external-auth
                    key: CODER_OAUTH2_GITHUB_CLIENT_SECRET
              CODER_OAUTH2_GITHUB_ALLOW_SIGNUP: "true"
              CODER_OAUTH2_GITHUB_ALLOW_EVERYONE: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 7080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "false"
          gethomepage.dev/name: Coder
          gethomepage.dev/description: Dev environment platform
          gethomepage.dev/group: Tools
          gethomepage.dev/icon: coder.png
          gethomepage.dev/href: "https://coder.${SECRET_DOMAIN}"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: ceph-rbd
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: *dataDir
      home:
        type: emptyDir
        globalMounts:
          - path: /home/coder
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
