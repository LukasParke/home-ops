---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Bifrost
    gethomepage.dev/description: AI gateway and LLM proxy
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: mdi-lightning-bolt
    gethomepage.dev/href: "https://bifrost.${SECRET_DOMAIN}"
spec:
  hostnames: ["bifrost.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bifrost
          port: 8080
