---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  chart:
    spec:
      chart: bifrost
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: bifrost
      version: "2.1.x"
  interval: 1h
  values:
    # Inject the llama-swap host keys as env vars so the providers' env.*
    # references resolve. Without these, every key has an empty value and all
    # routing fails with "no keys found for provider".
    env:
      - name: CERBERUS_LLAMASWAP_API_KEY
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: CERBERUS_LLAMASWAP_API_KEY
      - name: TALOS_LLAMASWAP_API_KEY
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: TALOS_LLAMASWAP_API_KEY
      - name: HEPHAESTUS_LLAMASWAP_API_KEY
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: HEPHAESTUS_LLAMASWAP_API_KEY
      - name: DELPHI_LLAMASWAP_API_KEY
        valueFrom:
          secretKeyRef:
            name: cluster-secrets
            key: DELPHI_LLAMASWAP_API_KEY

    image:
      # Always pin the tag - the chart will not start without it. Renovate
      # bumps this via the HelmRepository chart version and image tag.
      # v1.6.9 (chart appVersion lags at 1.5.12): in <=1.5.12 the auth
      # middleware rejected virtual-key-only inference requests (VK setter for
      # IsAPIKeyAuthContextKey missing in OSS), forcing Basic admin auth +
      # x-bf-vk together. In 1.6.x InferenceMiddleware delegates inference
      # auth entirely to the governance plugin, so a plain
      # `Authorization: Bearer sk-bf-...` virtual key works like a normal API
      # key. Dashboard/API routes stay protected by admin auth.
      tag: v1.6.9

    replicaCount: 1

    deploymentAnnotations:
      reloader.stakater.com/auto: "true"

    # Backing store for governance/usage metadata (cloudnative-pg).
    storage:
      mode: postgres

    postgresql:
      external:
        enabled: true
        host: bifrost-database-rw.default.svc.cluster.local
        port: 5432
        user: bifrost
        database: bifrost
        sslMode: disable
        existingSecret: bifrost-database-app
        passwordKey: password

    bifrost:
      encryptionKeySecret:
        name: cluster-secrets
        key: BIFROST_ENCRYPTION_KEY

      # Single replica for homelab; cluster mode (gossip/grpc) only if HA is
      # ever needed.
      #
      # One custom provider per llama-swap host. base_url is provider-level in
      # Bifrost (keys have no URL field), so the previous single-`openai`
      # provider with four keys could not route to four different hosts — it
      # defaulted to api.openai.com. Each provider wraps the built-in OpenAI
      # provider (llama-swap is OpenAI-compatible) with its own base_url.
      #
      # models: ["*"] per key: llama-swap's own config is the source of truth
      # for which models a host serves (GET /v1/models), so adding a model to
      # a host needs no Bifrost change. Clients must address models as
      # `<host>/<model>` (e.g. `talos/ornith-35b`) — with four providers a
      # bare model name cannot be mapped to a host. Keys live in
      # cluster-secrets.sops.yaml and are referenced as env.<KEY>.
      providers:
        cerberus:
          custom_provider_config:
            base_provider_type: openai
          network_config: &hostNetwork
            # NOTE: no /v1 suffix - Bifrost's openai provider family appends
            # /v1/<endpoint> itself (a /v1 here yields /v1/v1/... -> 404).
            base_url: http://10.10.10.218:8080
            # v1.5.9+ blocks RFC-1918 upstreams by default (SSRF guard). All
            # llama-swap hosts are on 10.10.10.0/24, so opt in explicitly —
            # without this, list-models fan-out fails and governance blocks
            # every chat request with model_blocked (empty model catalog).
            allow_private_network: true
            # Cold model swaps on llama-swap take 30-90s (235B: minutes).
            default_request_timeout_in_seconds: 600
            max_retries: 3
            # NOTE: key names are retry_backoff_*_ms per the chart schema.
            retry_backoff_initial_ms: 500
            retry_backoff_max_ms: 5000
          keys:
            - name: cerberus
              value: env.CERBERUS_LLAMASWAP_API_KEY
              models: ["*"]
              weight: 1
        talos:
          custom_provider_config:
            base_provider_type: openai
          network_config:
            <<: *hostNetwork
            base_url: http://10.10.10.81:8080
          keys:
            - name: talos
              value: env.TALOS_LLAMASWAP_API_KEY
              models: ["*"]
              weight: 1
        hephaestus:
          custom_provider_config:
            base_provider_type: openai
          network_config:
            <<: *hostNetwork
            base_url: http://10.10.10.65:8080
          keys:
            - name: hephaestus
              value: env.HEPHAESTUS_LLAMASWAP_API_KEY
              models: ["*"]
              weight: 1
        delphi:
          custom_provider_config:
            base_provider_type: openai
          network_config:
            <<: *hostNetwork
            base_url: http://10.10.10.18:8080
          keys:
            - name: delphi
              value: env.DELPHI_LLAMASWAP_API_KEY
              models: ["*"]
              weight: 1

      client:
        disableDbPingsInHealth: true

      # Protect the Bifrost admin dashboard/API with creds from cluster-secrets
      # (SOPS). Inference requests use virtual API keys; see docs.
      authConfig:
        isEnabled: true
        existingSecret: cluster-secrets
        usernameKey: BIFROST_ADMIN_USERNAME
        passwordKey: BIFROST_ADMIN_PASSWORD

    # Bifrost serves /health (liveness/readiness). disableDbPingsInHealth
    # means /health returns without pinging the DB.
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
