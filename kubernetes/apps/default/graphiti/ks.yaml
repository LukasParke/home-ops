---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: graphiti
spec:
  dependsOn:
    - name: csi-driver-nfs
      namespace: kube-system
    - name: rest-server
      namespace: volsync-system
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/default/graphiti/app
  postBuild:
    substitute:
      VOLSYNC_APP: graphiti
      VOLSYNC_PVC: graphiti
      VOLSYNC_SCHEDULE: "10 3 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: true
