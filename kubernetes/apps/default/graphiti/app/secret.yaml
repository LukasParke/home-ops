---
# API key credentials for the public memory.<domain> route.
#
# Opaque secret, one entry per client id — the format Envoy Gateway's
# SecurityPolicy apiKeyAuth expects (`credentialRefs`). The value must NOT
# include a "Bearer " prefix even though clients may send one; Envoy compares
# the extracted header value byte-for-byte against these entries.
#
# ${GRAPHITI_API_KEY} is substituted by Flux from the sops-encrypted
# `cluster-secrets` Secret (see ks.yaml postBuild.substituteFrom). One key
# shared by all agents keeps this simple; add per-client entries here if you
# ever need per-agent revocation.
apiVersion: v1
kind: Secret
metadata:
  name: graphiti-apikeys
type: Opaque
stringData:
  client-agents: ${GRAPHITI_API_KEY}
