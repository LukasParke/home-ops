---
# Graphiti MCP server config, mounted at $CONFIG_PATH (/app/mcp/config/config.yaml).
# Based on the upstream default (mcp_server/config/config.yaml) with:
#   - llm + embedder pointed at the in-cluster Bifrost gateway via $${OPENAI_API_URL}
#   - embedder dimensions driven by $${EMBEDDING_DIMENSIONS} (qwen3-embed = 1024;
#     the upstream default hardcodes 1536 for text-embedding-3-small)
# Supports $${VAR} / $${VAR:default} expansion at server startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphiti-config
data:
  # Executed by the site module at interpreter startup (lines in .pth files
  # starting with "import" are exec'd). Disables the MCP SDK's DNS-rebinding
  # host validation: FastMCP's constructor auto-enables it with a
  # localhost-only allowlist, and Graphiti sets host post-construction so it
  # can't be configured off — every gateway request was rejected with 421,
  # and Gateway API host rewrites can't supply the required port suffix.
  # (A sitecustomize.py doesn't work: Debian ships one in /usr/lib that
  # shadows venv site-packages.)
  # The envoy gateways (plus SecurityPolicy on the external route) are the
  # real security boundary. Still needed on mcp_server@main — upstream has no
  # config for it (getzep/graphiti#1745).
  graphiti-no-host-check.pth: |
    import mcp.server.transport_security as _ts; _ts.TransportSecurityMiddleware._validate_host = lambda self, host: True
  config.yaml: |
    server:
      transport: "http"
      host: "0.0.0.0"
      port: 8000

    llm:
      provider: "openai"  # OpenAI-compatible: Bifrost gateway → llama-swap hosts
      model: $${MODEL_NAME:talos/qwen3.8-27b-nothink}
      # qwen3.8 is a thinking model: reasoning consumed an entire 4096 budget
      # mid-extraction (observed 15.8k reasoning chars -> empty content),
      # failing Graphiti's response parse. 16384 leaves ample room for
      # reasoning + the structured answer.
      max_tokens: 16384
      # llama.cpp enforces json_schema via GBNF grammars, so the default is
      # safe. If extraction errors appear, set LLM_STRUCTURED_OUTPUT_MODE=json_object.
      structured_output_mode: $${LLM_STRUCTURED_OUTPUT_MODE:json_schema}

      providers:
        openai:
          api_key: $${OPENAI_API_KEY}
          api_url: $${OPENAI_API_URL:https://api.openai.com/v1}

    embedder:
      provider: "openai"  # Bifrost → hephaestus/qwen3-embed
      model: $${EMBEDDER_MODEL:hephaestus/qwen3-embed}
      dimensions: $${EMBEDDING_DIMENSIONS:1024}

      providers:
        openai:
          api_key: $${OPENAI_API_KEY}
          api_url: $${OPENAI_API_URL:https://api.openai.com/v1}

    database:
      provider: "falkordb"

      providers:
        falkordb:
          uri: $${FALKORDB_URI:redis://localhost:6379}
          password: $${FALKORDB_PASSWORD:}
          database: $${FALKORDB_DATABASE:default_db}

    graphiti:
      group_id: $${GRAPHITI_GROUP_ID:main}
      episode_id_prefix: $${EPISODE_ID_PREFIX:}
      user_id: $${USER_ID:mcp_user}
      entity_types:
        - name: "Preference"
          description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
        - name: "Requirement"
          description: "Specific needs, features, or functionality that must be fulfilled"
        - name: "Procedure"
          description: "Standard operating procedures and sequential instructions"
        - name: "Location"
          description: "Physical or virtual places where activities occur"
        - name: "Event"
          description: "Time-bound activities, occurrences, or experiences"
        - name: "Organization"
          description: "Companies, institutions, groups, or formal entities"
        - name: "Document"
          description: "Information content in various forms (books, articles, reports, etc.)"
        - name: "Topic"
          description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
        - name: "Person"
          description: "An individual human referenced in the content"
        - name: "Object"
          description: "Physical items, tools, devices, or possessions (use as last resort)"
