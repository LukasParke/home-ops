---
# API key credentials for the public steel-api route.
#
# Opaque secret, one entry per client id — this is the format Envoy Gateway's
# SecurityPolicy apiKeyAuth expects (`credentialRefs`). The value must NOT
# include a "Bearer " prefix even though clients may send one; Envoy compares
# the extracted header value byte-for-byte against these entries.
#
# ${STEEL_API_KEY} is substituted by Flux from the sops-encrypted
# `cluster-secrets` Secret (see ks.yaml postBuild.substituteFrom).
apiVersion: v1
kind: Secret
metadata:
  name: steel-apikeys
type: Opaque
stringData:
  client-pi: ${STEEL_API_KEY}
