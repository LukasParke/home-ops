---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # OAuth creds come from the `operator-oauth` Secret (secret.sops.yaml)
    operatorConfig:
      hostname: k8s-operator
    apiServerProxyConfig:
      mode: "false"
