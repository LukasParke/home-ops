---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-dns
  interval: 1h
  values:
    fullnameOverride: *app
    resources:
      requests:
        memory: 64Mi
    # Gateways (envoy-external / envoy-internal) are in this namespace; HTTPRoutes attach from other namespaces.
    gatewayNamespace: network
    logLevel: info
    provider:
      name: webhook
      webhook:
        resources:
          requests:
            memory: 64Mi
        image:
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.12@sha256:5338b99662e2e15048b4e14b49e17279d384970fdcb3c29169f509f806f49cbe
        env:
          # Local controller (UniFi Network >= 10.3.58, Integration API). Needs a LOCAL API key, not a unifi.ui.com one.
          - name: UNIFI_HOST
            value: https://10.10.10.1
          # Local controllers commonly use self-signed TLS; matches webhook default but set explicitly.
          - name: UNIFI_SKIP_TLS_VERIFY
            value: "true"
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret unifi-dns-secret
                key: UNIFI_API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    # TEMPORARY: first deploy against the Integration API only logs planned changes.
    # Remove once the logs look right.
    extraArgs:
      - --dry-run
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
      - service
    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - ${SECRET_DOMAIN}
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
