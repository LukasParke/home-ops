---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: csi-driver-nfs
      namespace: kube-system
    - name: envoy-gateway
      namespace: network
    - name: rest-server
      namespace: volsync-system
    - name: volsync
      namespace: volsync-system
  interval: 1h
  path: ./kubernetes/apps/forgejo/forgejo/app
  postBuild:
    substitute:
      VOLSYNC_APP: forgejo
      VOLSYNC_PVC: gitea-shared-storage
      VOLSYNC_SCHEDULE: "0 4 * * *"
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  wait: true
