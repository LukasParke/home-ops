---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-server
  labels:
    app.kubernetes.io/name: rest-server
spec:
  replicas: 1
  # RWO PVC: never run two replicas during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rest-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rest-server
    spec:
      containers:
        - name: rest-server
          image: docker.io/restic/rest-server:0.14.0
          # Image has no ENTRYPOINT; the binary must be the command.
          command: ["rest-server"]
          args:
            - --path=/data
            # Repos live at per-PVC subpaths (rest://host:8000/<ns>-<pvc>);
            # disable repo listing and prevent escaping --path.
            - --private-repos
            # Service is cluster-internal; Restic still encrypts every
            # repository using the SOPS-managed RESTIC_PASSWORD.
            - --no-auth
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: restic-repo
