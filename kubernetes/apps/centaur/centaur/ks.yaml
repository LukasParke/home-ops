---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: centaur
spec:
  dependsOn:
    - name: bifrost
      namespace: default
    - name: csi-driver-nfs
      namespace: kube-system
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/centaur/centaur/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: centaur-system
  wait: true
