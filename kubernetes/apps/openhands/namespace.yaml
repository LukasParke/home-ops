---
apiVersion: v1
kind: Namespace
metadata:
  name: openhands
  labels:
    # The DinD sidecar (Docker sandbox provider) requires privileged pods;
    # scoped to this namespace so PodSecurity stays baseline everywhere else.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
