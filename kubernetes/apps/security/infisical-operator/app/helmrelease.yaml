---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-secrets-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: secrets-operator
      version: "0.11.8"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: security
  values:
    # Point at the self-hosted instance instead of Infisical Cloud.
    hostAPI: https://infisical.${SECRET_DOMAIN}/api
    controllerManager:
      replicas: 1
