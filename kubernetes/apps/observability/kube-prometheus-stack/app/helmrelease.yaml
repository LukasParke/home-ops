---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.21.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    cleanPrometheusOperatorObjectNames: true
    additionalPrometheusRulesMap:
      home-ops:
        groups:
          - name: home-ops
            rules:
              - alert: ContainerRestartingFrequently
                expr: increase(kube_pod_container_status_restarts_total[1h]) >= 2
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently"
                  description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in the last hour."
              - alert: ProbeFailureRateHigh
                expr: sum by (namespace, pod, probe_type) (rate(prober_probe_total{result="failed"}[15m])) > 0.01
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} has failing {{ $labels.probe_type }} probes"
                  description: "Probe failures exceed 0.01 per second for 10 minutes."
              - alert: NFSClientRetransmissions
                expr: sum by (instance) (rate(node_nfs_rpc_retransmissions_total[15m])) > 0
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "NFS retransmissions detected on {{ $labels.instance }}"
                  description: "The node has retried NFS RPC requests for at least 10 minutes."
    kubeProxy:
      enabled: false
    kubeControllerManager:
      enabled: true
      endpoints: &cp_nodes
        - 10.10.10.61
        - 10.10.10.62
        - 10.10.10.63
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        scheme: https
        insecureSkipVerify: true
        interval: 30s
    kubeScheduler:
      enabled: true
      endpoints: *cp_nodes
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        scheme: https
        insecureSkipVerify: true
        interval: 30s
    kubeEtcd:
      enabled: true
      endpoints: *cp_nodes
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        scheme: http
        interval: 30s
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      resources:
        requests:
          memory: 32Mi
    prometheus:
      prometheusSpec:
        retention: 15d
        replicas: 1
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [prometheus]
                  topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
    alertmanager:
      enabled: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: discord
          group_by: ["alertname", "job"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - 'alertname="Watchdog"'
              receiver: "null"
        receivers:
          - name: discord
            discord_configs:
              - webhook_url: "${DISCORD_WEBHOOK_URL}"
                send_resolved: true
          - name: "null"
      alertmanagerSpec:
        replicas: 1
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [alertmanager]
                  topologyKey: kubernetes.io/hostname
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
    grafana:
      enabled: true
      adminUser: "${GRAFANA_USERNAME}"
      adminPassword: "${GRAFANA_PASSWORD}"
      ingress:
        enabled: false
      sidecar:
        resources:
          requests:
            memory: 32Mi
        dashboards:
          enabled: true
        datasources:
          enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    prometheusOperator:
      prometheusConfigReloader:
        resources:
          requests:
            memory: 32Mi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    kube-state-metrics:
      resources:
        requests:
          memory: 64Mi
