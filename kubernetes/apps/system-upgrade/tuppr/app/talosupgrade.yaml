---
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.11
  talosctl:
    image:
      tag: v1.13.11
  maintenance:
    windows:
      - start: "0 2 * * 0"
        duration: 4h
        timezone: America/Chicago
  # tuppr >= 0.2 replaced the kubectl-safety fields with an explicit toggle
  # (deleteLocalData/ignoreDaemonSets are now always on). Deprecated upstream in
  # favour of policy.drainTimeout; kept as-is to preserve behaviour.
  drain:
    enabled: true
  policy:
    debug: false
    force: false
    placement: hard
    rebootMode: default
    stage: false
    timeout: 30m
