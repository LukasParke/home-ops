# Reference only: not applied. Add or update these keys under `stringData` in
# `cluster-secrets.sops.yaml` (use: sops edit kubernetes/components/sops/cluster-secrets.sops.yaml).
#
# Used by default-namespace apps (Helm valueFrom.secretKeyRef name: cluster-secrets):
#   *arr:  RADARR__AUTH__APIKEY, SONARR__AUTH__APIKEY, LIDARR__AUTH__APIKEY, PROWLARR__AUTH__APIKEY
#   *arr NFS mounts: MEDIA_NFS_SERVER, MEDIA_NFS_PATH (/media), DOWNLOADS_NFS_PATH (/downloads)
#
# Homepage services.yaml (Flux substituteFrom on ks homepage):
#   Homelab links: UNRAID_URL, CLOUDFLARE_ACCOUNT_ID
#   Media/Apps widgets: *_AUTH__APIKEY, TAUTULLI_API_KEY, IMMICH_API_KEY,
#   GRAFANA_USERNAME, GRAFANA_PASSWORD
#
# Optional Homepage widgets not enabled by default because this repo does not have
# live credentials for them: UNRAID_API_KEY, QBITTORRENT_*, PLEX_*, and
# GHOSTFOLIO_WIDGET_BEARER_TOKEN. Ghostfolio bearer tokens expire every 6 months.
#
# Ghostfolio app (Helm env valueFrom cluster-secrets):
#   GHOSTFOLIO_ACCESS_TOKEN_SECRET, GHOSTFOLIO_JWT_SECRET_KEY
#
# Forgejo (Flux postBuild substituteFrom → HelmRelease admin block):
#   FORGEJO_ADMIN_USERNAME, FORGEJO_ADMIN_PASSWORD, FORGEJO_ADMIN_EMAIL
#
# Firecrawl (Helm valuesFrom → chart Secret):
#   FIRECRAWL_BULL_AUTH_KEY
#
# Network and other apps still use their own *-secret SOPS files; you can move those here
# the same way (one key per value) and point HelmReleases at cluster-secrets.
---
stringData:
  SECRET_DOMAIN: your.domain.tld
  MEDIA_NFS_SERVER: "10.0.0.0"
  MEDIA_NFS_PATH: /export/media
  DOWNLOADS_NFS_PATH: /export/downloads
  RADARR__AUTH__APIKEY: your-radarr-key
  SONARR__AUTH__APIKEY: your-sonarr-key
  LIDARR__AUTH__APIKEY: your-lidarr-key
  PROWLARR__AUTH__APIKEY: your-prowlarr-key
  UNRAID_URL: https://tower.lan
  CLOUDFLARE_ACCOUNT_ID: "0123456789abcdef0123456789abcdef"
  TAUTULLI_API_KEY: your-tautulli-api-key
  IMMICH_API_KEY: your-immich-api-key-with-server-statistics-permission
  GRAFANA_USERNAME: admin
  GRAFANA_PASSWORD: your-grafana-admin-password
  # Alertmanager and Flux notification-controller can share one Discord webhook.
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN"
  GHOSTFOLIO_ACCESS_TOKEN_SECRET: long-random-string-for-ghostfolio-app
  GHOSTFOLIO_JWT_SECRET_KEY: another-long-random-string-for-ghostfolio-app
  FORGEJO_ADMIN_USERNAME: forgejo-admin
  FORGEJO_ADMIN_PASSWORD: change-me-strong-password
  FORGEJO_ADMIN_EMAIL: admin@your.domain.tld
  FIRECRAWL_BULL_AUTH_KEY: long-random-string-for-firecrawl-queue-admin
  # Bifrost (replaces LiteLLM)
  BIFROST_ENCRYPTION_KEY: 32-byte-random-string
  BIFROST_ADMIN_USERNAME: admin
  BIFROST_ADMIN_PASSWORD: change-me-strong-password
  # Provider API keys (add only the ones you use)
  OPENAI_API_KEY: sk-...
  ANTHROPIC_API_KEY: sk-ant-...
  # Graphiti (shared agent memory, kubernetes/apps/default/graphiti):
  #   GRAPHITI_API_KEY gates the public memory.<domain> MCP route at the gateway.
  #   GRAPHITI_BIFROST_VK is Graphiti's Bifrost virtual key (seeded in the
  #   bifrost helmrelease governance block; sent as Bearer to the gateway).
  GRAPHITI_API_KEY: long-random-string-shared-by-mcp-clients
  GRAPHITI_BIFROST_VK: sk-bf-random-uuid
