machine:
  kubelet:
    extraConfig:
      serializeImagePulls: false
      systemReserved:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 5Gi
      kubeReserved:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 5Gi
      evictionHard:
        memory.available: 1Gi
        nodefs.available: 10%
        imagefs.available: 10%
        nodefs.inodesFree: 5%
      mergeDefaultEvictionSettings: true
    nodeIP:
      validSubnets:
        - 10.10.10.0/24
